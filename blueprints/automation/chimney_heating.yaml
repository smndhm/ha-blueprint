blueprint:
  name: "Allumage Cheminée / Chimney Heating"
  description: >
    Envoie une notification pour allumer la cheminée en anticipant le refroidissement
    intérieur, en tenant compte du temps de chauffe de la cheminée.

    Sends a notification to light the fireplace by anticipating indoor cooling,
    accounting for the fireplace warm-up time.
  domain: automation
  input:
    capteurs_interieurs:
      name: Capteurs intérieurs / Indoor sensors
      description: Capteurs de température intérieure / Indoor temperature sensors
      selector:
        entity:
          multiple: true
          device_class: temperature
    capteur_derivee:
      name: Capteur de vitesse de refroidissement / Cooling rate sensor
      description: >
        Capteur de dérivée de la température intérieure (°C/h ou °F/h).
        Voir docs/chimney.md pour le configurer.

        Derivative sensor for indoor temperature (°C/h or °F/h).
        See docs/chimney.md to set it up.
      selector:
        entity:
          domain: sensor
    capteurs_exterieurs:
      name: Capteurs extérieurs / Outdoor sensors
      description: >
        Capteurs de température extérieure. L'automation ne se déclenche
        que si la température extérieure est sous le seuil configuré.

        Outdoor temperature sensors. The automation only triggers
        if the outdoor temperature is below the configured threshold.
      selector:
        entity:
          multiple: true
          device_class: temperature
    devices_notification:
      name: Appareils à notifier / Devices to notify
      description: >
        Sélectionne un ou plusieurs appareils mobiles (companion app HA).
        Select one or more mobile devices (HA companion app).
      selector:
        device:
          integration: mobile_app
          multiple: true
    temp_confort:
      name: Température de confort (jour) / Comfort temperature (day)
      description: >
        Température intérieure minimale souhaitée en journée. L'automation anticipe
        pour ne pas passer en dessous.

        Minimum desired indoor temperature during the day. The automation anticipates
        to avoid dropping below this value.
      default: 19
      selector:
        number:
          min: 10
          max: 30
    temp_confort_nuit:
      name: Température de confort (nuit) / Night comfort temperature
      description: >
        Température acceptée la nuit, entre heure_debut_nuit et heure_fin_nuit.
        Mettre la même valeur que temp_confort pour désactiver.

        Acceptable temperature at night, between night_start and night_end.
        Set to the same value as temp_confort to disable.
      default: 17
      selector:
        number:
          min: 10
          max: 30
    heure_debut_nuit:
      name: Début de nuit / Night start
      description: >
        Heure de début de la période nuit (temp_confort_nuit utilisée à partir de là).

        Start time of the night period (temp_confort_nuit applies from here).
      default: "00:00:00"
      selector:
        time: {}
    heure_fin_nuit:
      name: Fin de nuit / Night end
      description: >
        Heure de fin de la période nuit (retour à temp_confort après cette heure).

        End time of the night period (reverts to temp_confort after this time).
      default: "06:30:00"
      selector:
        time: {}
    temps_chauffe:
      name: Temps de chauffe / Warm-up time (minutes)
      description: >
        Temps nécessaire pour que la cheminée commence à chauffer efficacement.
        L'automation déclenche la notification avec cette avance.

        Time for the fireplace to start heating effectively.
        The automation triggers the notification this far in advance.
      default: 45
      selector:
        number:
          min: 5
          max: 180
          unit_of_measurement: minutes
    delai_rappel:
      name: Délai de rappel / Reminder delay (minutes)
      description: >
        Délai d'attente avant le rappel quand vous appuyez sur "Rappelle-moi"
        dans la notification.

        Delay before the reminder when you tap "Remind me" in the notification.
      default: 15
      selector:
        number:
          min: 5
          max: 120
          unit_of_measurement: minutes
    seuil_ext:
      name: Seuil extérieur / Outdoor threshold
      description: >
        L'automation ne se déclenche que si la température extérieure max
        est en dessous de ce seuil. Entrez la valeur dans la même unité
        que vos capteurs (°C ou °F). Défaut : 15°C / 59°F.

        The automation only triggers if the outdoor max temperature is
        below this threshold. Enter the value in the same unit as your
        sensors (°C or °F). Default: 15°C / 59°F.
      default: 15
      selector:
        number:
          min: -20
          max: 100
    langue:
      name: Langue / Language
      default: "fr"
      selector:
        select:
          options:
            - label: Français
              value: "fr"
            - label: English
              value: "en"

trigger_variables:
  capteurs_interieurs: !input capteurs_interieurs
  capteurs_exterieurs: !input capteurs_exterieurs
  capteur_derivee: !input capteur_derivee
  temp_confort: !input temp_confort
  temp_confort_nuit: !input temp_confort_nuit
  heure_debut_nuit: !input heure_debut_nuit
  heure_fin_nuit: !input heure_fin_nuit
  temps_chauffe: !input temps_chauffe
  seuil_ext: !input seuil_ext

trigger:
  - platform: template
    value_template: >
      {% set temps_int = expand(capteurs_interieurs) | map(attribute='state') | map('float', none) | reject('none') | list %}
      {% set temps_ext = expand(capteurs_exterieurs) | map(attribute='state') | map('float', none) | reject('none') | list %}
      {% set rate = states(capteur_derivee) | float(none) %}
      {% set warmup_h = temps_chauffe / 60 %}
      {% set t_now = now().strftime('%H:%M:%S') %}
      {% if heure_debut_nuit > heure_fin_nuit %}
        {% set is_nuit = t_now >= heure_debut_nuit or t_now < heure_fin_nuit %}
      {% else %}
        {% set is_nuit = t_now >= heure_debut_nuit and t_now < heure_fin_nuit %}
      {% endif %}
      {% set confort = (temp_confort_nuit | float) if is_nuit else (temp_confort | float) %}
      {% if temps_int | length > 0 and temps_ext | length > 0 and rate is not none %}
        {% set temp_min_int = temps_int | min %}
        {% set temp_max_ext = temps_ext | max %}
        {% if temp_max_ext < seuil_ext and temp_min_int > confort and rate < 0 %}
          {{ (temp_min_int - confort) / (-rate) <= warmup_h }}
        {% else %}
          false
        {% endif %}
      {% else %}
        false
      {% endif %}
    for:
      minutes: 5
    id: allumer

mode: restart

action:
  - variables:
      capteurs_int: !input capteurs_interieurs
      capteurs_ext: !input capteurs_exterieurs
      capteur_der: !input capteur_derivee
      langue: !input langue
      devices_raw: !input devices_notification
      temp_cible: !input temp_confort
      temp_cible_nuit: !input temp_confort_nuit
      heure_debut_nuit: !input heure_debut_nuit
      heure_fin_nuit: !input heure_fin_nuit
      chauffe_min: !input temps_chauffe
      seuil: !input seuil_ext
      rappel_min: !input delai_rappel
  - variables:
      devices_list: "{{ devices_raw if devices_raw is list else [devices_raw] }}"
      device_ids: "{{ devices_list | select('string') | unique | list }}"
  - variables:
      temp_min_int: >
        {% set vals = expand(capteurs_int) | map(attribute='state') | map('float', none) | reject('none') | list %}
        {{ vals | min | round(1) if vals | length > 0 else '?' }}
      temp_max_ext: >
        {% set vals = expand(capteurs_ext) | map(attribute='state') | map('float', none) | reject('none') | list %}
        {{ vals | max | round(1) if vals | length > 0 else '?' }}
      rate: "{{ states(capteur_der) | float(0) | round(2) }}"
  - variables:
      temp_cible_eff: >
        {% set t = now().strftime('%H:%M:%S') %}
        {% if heure_debut_nuit > heure_fin_nuit %}
          {% set is_nuit = t >= heure_debut_nuit or t < heure_fin_nuit %}
        {% else %}
          {% set is_nuit = t >= heure_debut_nuit and t < heure_fin_nuit %}
        {% endif %}
        {{ (temp_cible_nuit | float) if is_nuit else (temp_cible | float) }}
  - variables:
      temps_restant: >
        {% set r = states(capteur_der) | float(0) %}
        {% set t = temp_min_int | float(0) %}
        {% if r < 0 and t > temp_cible_eff %}
          {{ ((t - temp_cible_eff) / (-r) * 60) | round(0) | int }}
        {% else %}
          0
        {% endif %}
      titre: >
        {% if langue == 'fr' %}🔥 Allumez la cheminée !{% else %}🔥 Light the fireplace!{% endif %}
      message: >
        {% set t = temp_min_int | float(0) %}
        {% if langue == 'fr' %}
          {% if t <= temp_cible_eff %}
            Il fait {{ temp_min_int }}° dedans. Vous êtes passé sous {{ temp_cible_eff }}° et ça continue de refroidir à {{ rate }}°/h. Il est temps d'allumer la cheminée.
          {% else %}
            Il fait {{ temp_min_int }}° dedans. Ça refroidit à {{ rate }}°/h, soit encore {{ temps_restant }} min avant {{ temp_cible_eff }}°. Allumez maintenant pour anticiper les {{ chauffe_min }} min de chauffe.
          {% endif %}
        {% else %}
          {% if t <= temp_cible_eff %}
            Indoor temperature is {{ temp_min_int }}°. You've dropped below {{ temp_cible_eff }}° and it's still cooling at {{ rate }}°/h. Time to light the fireplace.
          {% else %}
            Indoor temperature is {{ temp_min_int }}°. Dropping at {{ rate }}°/h, about {{ temps_restant }} min before reaching {{ temp_cible_eff }}°. Light it now to account for the {{ chauffe_min }} min warm-up.
          {% endif %}
        {% endif %}
  - repeat:
      for_each: "{{ device_ids }}"
      sequence:
        - service: "notify.mobile_app_{{ device_attr(repeat.item, 'name') | slugify }}"
          data:
            title: "{{ titre }}"
            message: "{{ message }}"
            data:
              actions:
                - action: CHEMINEE_ALLUMEE
                  title: "🔥 C'est allumé !"
                - action: CHEMINEE_RAPPEL
                  title: "⏰ Rappelle-moi"
  - repeat:
      count: 20
      sequence:
        - wait_for_trigger:
            - platform: event
              event_type: mobile_app_notification_action
              event_data:
                action: CHEMINEE_ALLUMEE
            - platform: event
              event_type: mobile_app_notification_action
              event_data:
                action: CHEMINEE_RAPPEL
          timeout:
            hours: 4
          continue_on_timeout: true
        - if:
            - condition: template
              value_template: >
                {{ wait.trigger is none or wait.trigger.event.data.action == 'CHEMINEE_ALLUMEE' }}
          then:
            - stop: "Terminé"
        - delay:
            minutes: "{{ rappel_min }}"
        - variables:
            temp_min_int: >
              {% set vals = expand(capteurs_int) | map(attribute='state') | map('float', none) | reject('none') | list %}
              {{ vals | min | round(1) if vals | length > 0 else '?' }}
            temp_max_ext: >
              {% set vals = expand(capteurs_ext) | map(attribute='state') | map('float', none) | reject('none') | list %}
              {{ vals | max | round(1) if vals | length > 0 else '?' }}
            rate: "{{ states(capteur_der) | float(0) | round(2) }}"
        - variables:
            temp_cible_eff: >
              {% set t = now().strftime('%H:%M:%S') %}
              {% if heure_debut_nuit > heure_fin_nuit %}
                {% set is_nuit = t >= heure_debut_nuit or t < heure_fin_nuit %}
              {% else %}
                {% set is_nuit = t >= heure_debut_nuit and t < heure_fin_nuit %}
              {% endif %}
              {{ (temp_cible_nuit | float) if is_nuit else (temp_cible | float) }}
        - variables:
            temps_restant: >
              {% set r = states(capteur_der) | float(0) %}
              {% set t = temp_min_int | float(0) %}
              {% if r < 0 and t > temp_cible_eff %}
                {{ ((t - temp_cible_eff) / (-r) * 60) | round(0) | int }}
              {% else %}
                0
              {% endif %}
            titre: >
              {% if langue == 'fr' %}🔥 Allumez la cheminée !{% else %}🔥 Light the fireplace!{% endif %}
            message: >
              {% set t = temp_min_int | float(0) %}
              {% if langue == 'fr' %}
                {% if t <= temp_cible_eff %}
                  Il fait {{ temp_min_int }}° dedans. Vous êtes passé sous {{ temp_cible_eff }}° et ça continue de refroidir à {{ rate }}°/h. Il est temps d'allumer la cheminée.
                {% else %}
                  Il fait {{ temp_min_int }}° dedans. Ça refroidit à {{ rate }}°/h, soit encore {{ temps_restant }} min avant {{ temp_cible_eff }}°. Allumez maintenant pour anticiper les {{ chauffe_min }} min de chauffe.
                {% endif %}
              {% else %}
                {% if t <= temp_cible_eff %}
                  Indoor temperature is {{ temp_min_int }}°. You've dropped below {{ temp_cible_eff }}° and it's still cooling at {{ rate }}°/h. Time to light the fireplace.
                {% else %}
                  Indoor temperature is {{ temp_min_int }}°. Dropping at {{ rate }}°/h, about {{ temps_restant }} min before reaching {{ temp_cible_eff }}°. Light it now to account for the {{ chauffe_min }} min warm-up.
                {% endif %}
              {% endif %}
        - repeat:
            for_each: "{{ device_ids }}"
            sequence:
              - service: "notify.mobile_app_{{ device_attr(repeat.item, 'name') | slugify }}"
                data:
                  title: "{{ titre }}"
                  message: "{{ message }}"
                  data:
                    actions:
                      - action: CHEMINEE_ALLUMEE
                        title: "🔥 C'est allumé !"
                      - action: CHEMINEE_RAPPEL
                        title: "⏰ Rappelle-moi"
